# Настройки применяются только к musl-целям, поэтому обычная сборка
# (`cargo build --release` под glibc) остаётся динамической и быстрой.
#
# musl + crt-static = полностью статический бинарник без внешних зависимостей:
# его можно просто скопировать на любую машину с той же архитектурой.

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "strip=symbols"]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "strip=symbols"]
linker = "rust-lld"

# Кросс-компиляция под Windows / ARM64 — раскомментируйте и укажите свой линкер.
# [target.x86_64-pc-windows-gnu]
# linker = "x86_64-w64-mingw32-gcc"
# rustflags = ["-C", "strip=symbols"]
#
# [target.aarch64-unknown-linux-gnu]
# linker = "aarch64-linux-gnu-gcc"
