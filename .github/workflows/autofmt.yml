name: autofmt
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "no fmt"; exit 0; fi
          git add -A
          git commit -m "fmt: cargo fmt --all"
          git push origin HEAD:${{ github.ref_name }}
