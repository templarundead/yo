# =============================================================================
#  YOL — «Ё лайт»: CI/CD
#
#  Две последовательные стадии:
#
#    Stage 1  lint-and-test   — форматирование, clippy (-D warnings), тесты
#    Stage 2  build           — матричная сборка релизных бинарников
#                               (Windows MSVC + Linux GNU) и выгрузка артефактов
#
#  Stage 2 запускается только после успешного Stage 1 (`needs:`).
# =============================================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Повторный пуш в тот же PR отменяет предыдущий прогон — экономим минуты.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS: never
  RUST_BACKTRACE: 1
  # Размер словаря ~1.8 МБ, поэтому тесты быстрее гонять в release.
  BIN_NAME: yol

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  #  STAGE 1 — тесты и линтеры
  # ═══════════════════════════════════════════════════════════════════════════
  lint-and-test:
    name: Stage 1 · Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libssl-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry, index and build dir
        uses: Swatinem/rust-cache@v2
        with:
          # Ключ намеренно без хеша Cargo.lock: кеш переживает мелкие правки.
          shared-key: yol-ci
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          cache-all-crates: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, all features, deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build tests
        run: cargo test --no-run --all-targets

      - name: Run tests (unit + integration + doc)
        run: cargo test --all

      - name: Run tests (release — реальные цифры производительности)
        run: cargo test --release --all

      # WGPU — единственная опциональная фича. Если её отключить, `main.rs`
      # обязан собраться и без `eframe::Renderer::Wgpu`, поэтому проверяем
      # обе конфигурации — иначе фича сгниёт незамеченной.
      - name: Check feature combinations
        run: |
          cargo check --all-targets                        # OpenGL + WGPU
          cargo clippy --all-targets -- -D warnings        # то же, с линтером
          cargo check --all-targets --no-default-features  # только OpenGL

  # ═══════════════════════════════════════════════════════════════════════════
  #  STAGE 2 — релизные бинарники
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Stage 2 · Build
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: yol.exe
            archive: zip

          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: yol
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libssl-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry, index and build dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: yol-build-${{ matrix.target }}
          cache-all-crates: true

      # Профиль `release` в Cargo.toml уже содержит
      # lto = true, opt-level = 3, codegen-units = 1, panic = "abort", strip = true.
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test the binary (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          "$BIN" --version
          printf 'Актер вышел на сцену, а береза стояла у елки.' > /tmp/smoke.txt
          "$BIN" -i /tmp/smoke.txt -o /tmp/smoke.out.txt -q --out-enc utf8
          cat /tmp/smoke.out.txt
          grep -q 'Актёр' /tmp/smoke.out.txt
          grep -q 'берёза' /tmp/smoke.out.txt
          grep -q 'ёлки'   /tmp/smoke.out.txt

      - name: Smoke test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          & $bin --version
          Set-Content -Path "$env:TEMP\smoke.txt" -Value 'Актер вышел на сцену, а береза стояла у елки.' -Encoding UTF8
          & $bin -i "$env:TEMP\smoke.txt" -o "$env:TEMP\smoke.out.txt" -q --out-enc utf8
          $out = Get-Content "$env:TEMP\smoke.out.txt" -Raw
          Write-Host $out
          if ($out -notmatch 'Актёр')  { throw "no Актёр" }
          if ($out -notmatch 'берёза') { throw "no берёза" }
          if ($out -notmatch 'ёлки')   { throw "no ёлки" }

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          cp README.md BUILD.md LICENSE dist/
          tar -czf "${{ env.BIN_NAME }}-${{ matrix.name }}.tar.gz" -C dist .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          Copy-Item README.md,BUILD.md,LICENSE dist/
          Compress-Archive -Path dist\* -DestinationPath "${{ env.BIN_NAME }}-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.name }}
          path: ${{ env.BIN_NAME }}-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  #  Дополнительно: статический ARM64 (Orange Pi 5+ / RK3588).
  #  Не обязателен для «зелёного» CI, но именно под него собирается
  #  самодостаточный бинарник для одноплатников.
  # ═══════════════════════════════════════════════════════════════════════════
  build-arm64:
    name: Stage 2 · Build linux-aarch64 (musl, static)
    needs: lint-and-test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --locked

      - name: Cache cargo registry, index and build dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: yol-build-aarch64-unknown-linux-musl
          cache-all-crates: true

      - name: Build static aarch64 binary
        run: cross build --release --target aarch64-unknown-linux-musl

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/${{ env.BIN_NAME }} dist/
          cp README.md BUILD.md LICENSE dist/
          tar -czf "${{ env.BIN_NAME }}-linux-aarch64-musl.tar.gz" -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-linux-aarch64-musl
          path: ${{ env.BIN_NAME }}-linux-aarch64-musl.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  #  Итог
  # ═══════════════════════════════════════════════════════════════════════════
  summary:
    name: CI summary
    if: always()
    needs: [lint-and-test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "lint-and-test : ${{ needs.lint-and-test.result }}"
          echo "build         : ${{ needs.build.result }}"
          if [ "${{ needs.lint-and-test.result }}" != "success" ] \
          || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::CI failed"
            exit 1
          fi
          echo "::notice::Stage 1 and Stage 2 passed"
