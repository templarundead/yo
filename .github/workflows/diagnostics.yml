# =============================================================================
#  TEMPORARY diagnostics workflow — используется только во время разработки.
#
#  Зачем: логи GitHub Actions читаются с results-receiver.actions.githubusercontent.com,
#  который недоступен из рабочей песочницы. Этот workflow складывает вывод
#  `cargo fmt` / `cargo clippy` / `cargo test` в комментарий к PR, откуда его
#  уже можно прочитать через api.github.com.
#
#  Запуск вручную:  gh workflow run diagnostics.yml --ref <branch>
#  По завершении — удалить.
# =============================================================================

name: Diagnostics (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: never
  CARGO_TERM_PROGRESS: never
  RUST_BACKTRACE: 1

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev libssl-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: yol-diag

      # ── 1. Форматирование ──────────────────────────────────────────────
      - name: Run cargo fmt and push the result
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "ALREADY_FORMATTED=1" >> "$GITHUB_ENV"
            : > fmt.patch
          else
            echo "ALREADY_FORMATTED=0" >> "$GITHUB_ENV"
            git --no-pager diff > fmt.patch
            git config user.name "arena-bot"
            git config user.email "bot@arena.local"
            git add -A
            git commit -m "style: cargo fmt --all"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # ── 2. Компиляция и линтер ────────────────────────────────────────
      - name: Clippy
        id: clippy
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          tail -60 clippy.txt

      # ── 3. Тесты ──────────────────────────────────────────────────────
      - name: Tests
        id: test
        run: |
          set +e
          cargo test --all > test.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          tail -80 test.txt

      # ── 4. Результат — комментарием в PR ──────────────────────────────
      - name: Post diagnostics as a PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIPPY_EXIT: ${{ steps.clippy.outputs.exit }}
          TEST_EXIT: ${{ steps.test.outputs.exit }}
        run: |
          trim() { head -c "$2" "$1"; echo; echo "… (обрезано)"; }
          {
            echo "## Диагностика CI (временный workflow)"
            echo
            echo "- ветка: \`${GITHUB_REF_NAME}\`"
            echo "- clippy exit: \`${CLIPPY_EXIT}\`, test exit: \`${TEST_EXIT}\`"
            echo
            echo "### cargo fmt --all"
            echo '```diff'
            if [ -s fmt.patch ]; then trim fmt.patch 12000; else echo "(уже отформатировано)"; fi
            echo '```'
            echo
            echo "### cargo clippy --all-targets --all-features -- -D warnings"
            echo '```'
            if [ -s clippy.txt ]; then trim clippy.txt 24000; else echo "(вывод пуст)"; fi
            echo '```'
            echo
            echo "### cargo test --all"
            echo '```'
            if [ -s test.txt ]; then trim test.txt 24000; else echo "(вывод пуст)"; fi
            echo '```'
          } > body.md
          wc -c body.md
          gh pr comment 2 --repo templarundead/yo --body-file body.md
