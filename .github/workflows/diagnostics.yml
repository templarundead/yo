# =============================================================================
#  TEMPORARY diagnostics workflow — только на время разработки.
#
#  Зачем: логи GitHub Actions лежат на results-receiver.actions.githubusercontent.com,
#  который недоступен из рабочей песочницы. Этот workflow складывает вывод
#  `cargo fmt` / `cargo clippy` / `cargo test` в комментарий к PR, откуда его
#  уже можно прочитать через api.github.com.
#
#  По завершении работы — удалить файл.
# =============================================================================

name: Diagnostics (temporary)

# NB: `workflow_dispatch` резолвится по файлам на дефолтной ветке, поэтому
# из ветки разработки его не дёрнуть. Push-триггер берёт workflow из самой
# ветки — ровно то, что нужно.
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: never
  CARGO_TERM_PROGRESS: never
  RUST_BACKTRACE: 1

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev libssl-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: yol-diag

      # ── 1. Форматирование ──────────────────────────────────────────────
      - name: Check formatting
        id: fmt
        run: |
          set +e
          cargo fmt --all -- --check > fmt.patch 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      # ── 2. Компиляция и линтер ─────────────────────────────────────────
      # `--message-format=short` даёт по одной строке на диагностику и
      # отбрасывает весь прогресс сборки, иначе полезный вывод тонет в шуме.
      - name: Clippy
        id: clippy
        run: |
          set +e
          cargo clippy --all-targets --all-features --message-format=short -- -D warnings 2>&1 \
            | grep -E '^(src/|tests/|benches/|error|warning)' \
            | awk '!seen[$0]++' \
            | head -150 > clippy.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
          cat clippy.txt

      # ── 3. Тесты ───────────────────────────────────────────────────────
      - name: Build test binaries
        id: build
        run: |
          set +e
          cargo test --all --no-run --message-format=short 2>&1 \
            | grep -E '^(src/|tests/|error|warning)' \
            | awk '!seen[$0]++' \
            | head -150 > build.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
          cat build.txt

      - name: Run tests
        id: test
        run: |
          set +e
          cargo test --all --no-fail-fast 2>&1 \
            | grep -E 'test result|panicked at|^---- |^error|FAILED|^failures:|Running|Doc-tests' \
            | head -120 > test.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
          cat test.txt

      # ── 4. Результат — комментарием в PR ───────────────────────────────
      - name: Post diagnostics as a PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FMT_EXIT: ${{ steps.fmt.outputs.exit }}
          CLIPPY_EXIT: ${{ steps.clippy.outputs.exit }}
          BUILD_EXIT: ${{ steps.build.outputs.exit }}
          TEST_EXIT: ${{ steps.test.outputs.exit }}
        run: |
          trim() {
            if [ ! -s "$1" ]; then echo "(пусто)"; return; fi
            if [ "$(wc -c < "$1")" -gt "$2" ]; then head -c "$2" "$1"; echo; echo "… (обрезано)"
            else cat "$1"; fi
          }
          {
            echo "## Диагностика CI (временный workflow)"
            echo
            echo "- ветка: \`${GITHUB_REF_NAME}\`, коммит: \`${GITHUB_SHA::7}\`"
            echo "- fmt: \`${FMT_EXIT}\` · clippy: \`${CLIPPY_EXIT}\` · build: \`${BUILD_EXIT}\` · test: \`${TEST_EXIT}\`"
            echo
            echo "### cargo fmt --all -- --check"
            echo '```diff'
            trim fmt.patch 8000
            echo '```'
            echo
            echo "### cargo clippy --all-targets --all-features -- -D warnings"
            echo '```'
            trim clippy.txt 12000
            echo '```'
            echo
            echo "### cargo test --all --no-run"
            echo '```'
            trim build.txt 12000
            echo '```'
            echo
            echo "### cargo test --all"
            echo '```'
            trim test.txt 10000
            echo '```'
          } > body.md
          wc -c body.md
          gh pr comment 2 --repo templarundead/yo --body-file body.md

      # ── 5. Автоформатирование — в самом конце, чтобы push не отменил прогон
      - name: Apply cargo fmt and push
        if: always()
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "arena-bot"
            git config user.email "bot@arena.local"
            git add -A
            git commit -m "style: cargo fmt --all"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "already formatted"
          fi
